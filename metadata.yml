Title: Neuro-Symbolic AI for Automated Chemical Classification in the ChEBI Ontology
Description: Places a molecule within the ChEBI ontology, returning the semantic parent classes it belongs to as a list. Glauer and colleagues built Chebifier on a neuro-symbolic approach that uses the ontology's own axioms during training, so predictions respect the class hierarchy and the system can absorb new classes as ChEBI grows rather than needing to be rebuilt. Assignments are inferred from structure, so they express ontological classification rather than any measured property.
