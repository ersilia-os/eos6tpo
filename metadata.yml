Status: Ready
Title: Neuro-Symbolic AI for Automated Chemical Classification in the ChEBI 
  Ontology
Description: Assigns a molecule its parent classes in ChEBI, the reference ontology
  for biologically interesting chemistry, returning them as one semicolon-separated
  list. Glauer, Hastings and colleagues built Chebifier on a neuro-symbolic approach
  in which the ontology's own structure shapes the learning system, so the classifier
  can keep pace as ChEBI grows instead of being rebuilt by hand. Ersilia serves a
  later release than the published one, an ensemble that combines the transformer
  with a graph network, rule-based classifiers and a ChEBI lookup, reconciled by weighted
  majority vote.
